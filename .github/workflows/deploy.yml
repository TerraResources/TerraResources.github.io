name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site and generated downloads
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check deployed routes and assets
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://terraresources.github.io"
          for path in / /resources/ /sources/ /referencing/ /learn/ /about/ /privacy/ /robots.txt /sitemap.xml /site.webmanifest /downloads/TerraResources-Word-Toolkit.zip; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 "${base_url}${path}" >/dev/null
            printf 'checked %s\n' "$path"
          done
